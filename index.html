<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Be Inspired</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1 class="title">Welcome to Your Daily Dose of Inspiration</h1>
    <p id="quote" class="quote">Loading inspiration...</p>
    <div class="buttons">
      <button id="themeBtn">Toggle Theme</button>
      <button id="animateBtn">Get Inspired</button>
      <button id="musicBtn">Toggle Music</button>
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="inspiration.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>

  <script src="script.js"></script>
</body>
</html>
